<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma Maestro | Plataforma Minera Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.js"></script>
    <link href="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.css" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        .header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            padding: 16px 32px;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .header-icon {
            background: var(--accent);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        #gantt_here {
            width: 100%;
            height: calc(100vh - 65px);
            background: var(--bg-deep);
        }

        /* DHTMLX Overrides for Pro Max Style */
        .gantt_container {
            background-color: transparent !important;
            border: none !important;
        }
        
        .gantt_grid_scale, .gantt_task_scale {
            background-color: #1e293b !important;
            color: var(--text-dim) !important;
            border-bottom: 1px solid var(--border) !important;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .gantt_grid_data .gantt_row, .gantt_task_row {
            background-color: transparent !important;
            border-bottom: 1px solid var(--border) !important;
            transition: background 0.2s;
        }

        .gantt_grid_data .gantt_row:hover, .gantt_task_row:hover {
            background-color: rgba(99, 102, 241, 0.05) !important;
        }

        .gantt_cell {
            color: var(--text-main) !important;
            border-right: 1px solid var(--border) !important;
        }

        .gantt_task_line {
            border-radius: 6px !important;
            border: none !important;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .gantt_task_line:hover {
            transform: scaleY(1.1);
            box-shadow: 0 8px 15px rgba(99, 102, 241, 0.3);
        }

        .gantt_task_content {
            font-size: 12px;
            font-weight: 500;
        }

        .gantt_side_content {
            color: var(--text-dim) !important;
            font-size: 11px;
        }

        .gantt_task_link .gantt_line_wrapper div {
            background-color: var(--accent) !important;
            opacity: 0.4;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Custom Task Colors */
        .gantt_task_line.project-task { background: linear-gradient(90deg, #6366f1, #8b5cf6); }
        .gantt_task_line.regular-task { background: linear-gradient(90deg, #3b82f6, #2563eb); }
    </style>
</head>
<body>
    <div class="header">

        Cronograma Maestro: Plataforma Minera de Alta Disponibilidad

            {unit: "month", step: 1, format: "%F, %Y"},
            {unit: "week", step: 1, format: "Semana %W"}

            return task.type === "project" ? "project-task" : "regular-task";
