<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InformeCliente — Mantenimiento (PS1)</title>
  <style>
    :root {
      --bg: #0d1521;
      --panel: #131d2e;
      --border: rgba(56, 189, 248, 0.22);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --warn: #f59e0b;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #1d2532 0%, #0d1521 45%, #070d16 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    header {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      background: rgba(7, 13, 22, 0.85);
      margin-bottom: 1.25rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .sub { color: var(--muted); font-size: 0.85rem; margin: 0; }
    .banner {
      margin-top: 0.75rem;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      font-size: 0.8rem;
      color: #fde68a;
    }
    .layout { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 900px) {
      .layout { grid-template-columns: 1fr 1fr; align-items: start; }
    }
    #script-list { display: flex; flex-direction: column; gap: 0.75rem; }
    h2.cat {
      margin: 0.5rem 0 0.25rem;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent);
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      background: var(--panel);
    }
    .card--warn { border-color: rgba(245, 158, 11, 0.45); }
    .card-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .card-title { font-weight: 700; font-size: 0.95rem; }
    .pill {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
    }
    .card-desc { margin: 0.45rem 0; font-size: 0.82rem; color: var(--muted); }
    .card-meta { font-size: 0.72rem; font-family: ui-monospace, monospace; color: #64748b; margin-bottom: 0.6rem; }
    .btn-run {
      cursor: pointer;
      border: 1px solid rgba(56, 189, 248, 0.55);
      background: linear-gradient(120deg, rgba(56, 189, 248, 0.25), rgba(251, 191, 36, 0.12));
      color: #f0f9ff;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
    }
    .btn-run:hover { filter: brightness(1.08); }
    .btn-run:disabled { opacity: 0.45; cursor: not-allowed; }
    .panel-out {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem;
      background: rgba(7, 13, 22, 0.92);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .panel-out h2 { margin: 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    #btn-clear {
      cursor: pointer;
      font-size: 0.72rem;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      border: 1px solid #475569;
      background: transparent;
      color: var(--muted);
    }
    .status { font-size: 0.78rem; min-height: 1.2em; }
    .status.ok { color: #4ade80; }
    .status.err { color: var(--danger); }
    #output {
      flex: 1;
      margin: 0;
      padding: 0.65rem;
      font-size: 0.72rem;
      line-height: 1.4;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: min(55vh, 520px);
      overflow: auto;
      background: #070d16;
      border-radius: 8px;
      border: 1px solid #1e293b;
      color: #cbd5e1;
    }
    .err { color: var(--danger); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Mantenimiento InformeCliente</h1>
      <p class="sub">Invocación controlada de scripts <code>scripts/*.ps1</code> desde el navegador (solo este equipo).</p>
      <div class="banner">
        <strong>Seguridad:</strong> el servidor escucha solo en <code>127.0.0.1</code>. No exponga el puerto a Internet.
        Solo se ejecutan scripts listados en <code>manifest.json</code> (lista blanca).
      </div>
    </header>
    <div class="layout">
      <div id="script-list" aria-live="polite"></div>
      <div class="panel-out">
        <h2>Salida</h2>
        <div class="toolbar">
          <span id="status" class="status"></span>
          <button type="button" id="btn-clear">Limpiar</button>
        </div>
        <pre id="output"></pre>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
