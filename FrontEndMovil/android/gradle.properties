org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# NOTA IMPORTANTE PARA QUIEN COMPILE ESTE PROYECTO DESDE Claude Code EN
# WINDOWS (ver README.md, "Entorno de desarrollo"): cualquier `./gradlew`
# o `flutter build`/`flutter run` fallará con
# "java.io.IOException: Unable to establish loopback connection" a menos
# que se exporte, ANTES del comando, una variable de entorno:
#
#   export JAVA_TOOL_OPTIONS="-Djdk.net.unixdomain.tmpdir=C:\\dev\\tmp"
#
# (con `C:\dev\tmp` ya creado). Causa real (issue conocido de la sandbox de
# Claude Code en Windows, anthropics/claude-code#77508): el JDK 17+ abre un
# socket AF_UNIX para el "wakeup pipe" interno de `Selector.open()`, y la
# sandbox virtualiza/redirige %TEMP% a una ruta que rompe ese socket. Esto
# NO se puede resolver solo con `org.gradle.jvmargs` (esta propiedad la lee
# el JVM del daemon, pero el fallo ocurre antes, en el JVM del *launcher*
# de Gradle) — debe ir en `JAVA_TOOL_OPTIONS`, que si se propaga a
# launcher, daemon y workers por igual. Compilar desde una terminal normal
# (fuera de Claude Code) no tiene este problema.
# "Could not close incremental caches" en :flutter_tts:compileDebugKotlin
# (y otros plugins): mismo tipo de fricción de la sandbox de Claude Code en
# Windows con archivos de caché de Kotlin (.tab) escritos/cerrados muy
# rápido — deshabilitar la compilación incremental de Kotlin lo evita, a
# cambio de recompilar más código en cada build (aceptable en este
# entorno).
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
