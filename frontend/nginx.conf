# Rate limiting a nivel proxy (defensa en profundidad además del limitador
# de login por cuenta a nivel app en backend/src/main.cpp — ver
# GAP_ANALYSIS_2026-07-04.md). Estas zonas viven en el contexto http porque
# este archivo se incluye vía conf.d/*.conf dentro del http{} base de la
# imagen nginx (ver frontend/Dockerfile).
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Compresión (2026-08-02): la imagen base de nginx trae `gzip on` pero SOLO
# para text/html — todo lo demás salía sin comprimir. El bundle de la SPA son
# ~9.3MB de JS (main + ReadOnlyViewer + html2canvas) que viajaban íntegros por
# la red en cada carga fría: sobre un enlace satelital/4G de unidad minera
# (~2 Mbps reales) eso son ~37s solo de descarga de JS. Con gzip nivel 6 el JS
# baja a ~1/4 (JS minificado comprime muy bien).
#
# `gzip_static on` sirve el `.gz` precomprimido si existe junto al asset, sin
# gastar CPU en runtime; hoy el build no los genera todavía, así que cae al
# gzip dinámico de abajo (queda listo para cuando se precomprima en el build).
#
# gzip_proxied any: sin esto nginx NO comprime respuestas que vienen de un
# upstream proxificado (las de /api/), que es justo donde están los JSON
# grandes de telemetría/KPIs.
#
# gzip_min_length 1024: comprimir payloads diminutos (la mayoría de respuestas
# JSON de estado) cuesta más CPU y bytes de cabecera de lo que ahorra.
gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/geo+json
    application/xml
    application/wasm
    image/svg+xml;

server {
    listen 80;
    server_name localhost;

    # Re-resolución DNS de upstreams (incidente 2026-07-11): nginx resuelve los
    # hostnames de proxy_pass UNA sola vez al arrancar; si un contenedor
    # upstream se recrea con otra IP (p.ej. `docker compose up -d web`), nginx
    # sigue apuntando a la IP vieja y TODO /api devuelve 502 hasta reiniciarlo,
    # aunque ambos contenedores figuren "healthy". Con el resolver embebido de
    # Docker (127.0.0.11) + proxy_pass vía variable, nginx re-resuelve cada
    # valid=10s y sobrevive a recreaciones de upstream sin reinicio.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_backend backend:8081;
    set $upstream_formula formula_engine:8020;
    set $upstream_tiles tileserver:8000;

    # Headers de seguridad para el contenido ESTÁTICO servido por nginx
    # (SPA/assets), aplicados solo en las locations de abajo — NO a nivel
    # `server`, para no duplicarlos sobre las respuestas proxificadas
    # (/api/, /formula-api/): el backend C++ ya los agrega una vez en
    # router.cpp::dispatch(), y `add_header` a nivel server se propagaría
    # también a esas locations sumándose a los del backend (headers
    # repetidos en la misma respuesta).
    # CSP (cerrado 2026-07-07 tras auditar todos los orígenes externos reales:
    # Google Fonts, Tailwind Play CDN, y los WMS de mapas). img-src permite
    # "https:" sin restringir host porque MapViewer.tsx tiene un campo real de
    # "WMS personalizado (URL manual)" que deja al usuario apuntar a cualquier
    # GeoServer propio — un allowlist fijo de hosts rompería esa función. Ver
    # el mismo razonamiento, más detallado, en applySecurityHeaders() de
    # backend/src/http/router.cpp.

    # Evita que el navegador deje una SPA antigua (login viejo) al no reconstruir la imagen
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        expires -1;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    }

    # Service Worker de tiles (tile-cache-sw.js) con CSP PROPIA — incidente
    # real 2026-07-18: los fetch() que un Service Worker hace están regidos
    # por la CSP del SCRIPT DEL WORKER, no por la de la página. Este SW
    # intercepta los tiles de mapas (Google satelital, WMS INGEMMET/MINEM/
    # OEFA/SENAMHI/IDEP...) y los re-pide con fetch() interno; con la CSP
    # general de abajo (connect-src 'self' ws: wss:) TODOS esos fetch
    # externos morían al instante ("Failed to fetch" en 0ms) → el 100% de
    # los tiles del mapa (base + WMS gubernamentales) aparecían rotos aunque
    # los servidores respondieran bien. Se abre connect-src https: SOLO para
    # este worker (mismo criterio que img-src https: de la página: el campo
    # "WMS personalizado (URL manual)" permite cualquier GeoServer, no hay
    # allowlist cerrada posible); la CSP estricta de la SPA no cambia.
    location = /tile-cache-sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; connect-src 'self' https:" always;
        expires -1;
    }

    # SPA: evita HTML antiguo (y referencias a chunks viejos) al abrir rutas como /report-studio sin /index.html
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # Sin autoindex: el frontend siempre referencia rutas exactas conocidas
    # (ej. AuthGateway.tsx login backgrounds, MapViewer tiles/GeoJSON) — listar
    # el árbol completo del volumen ./data no aporta funcionalidad y expone
    # nombres de archivo internos.
    location /data/ {
        alias /data/;
        autoindex off;
    }

    # Motor FORMULA embebido: API + WS (mismo origen que la SPA; no usa puerto 8021 externo)
    location ^~ /formula-api/ws {
        rewrite ^/formula-api(/ws.*)$ $1 break;
        proxy_pass http://$upstream_formula;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Token del motor FORMULA inyectado server-side (envsubst al arrancar,
        # ver frontend/Dockerfile): el editor embebido ya no depende de que el
        # usuario siembre AUTH_TOKEN en localStorage (herencia del despliegue
        # standalone) y el secreto nunca se expone al navegador.
        proxy_set_header Authorization "Bearer ${BEEMETRY_FORMULA_AUTH_TOKEN}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /formula-api/ {
        rewrite ^/formula-api(/.*)$ $1 break;
        proxy_pass http://$upstream_formula;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    # Login: límite más estricto (ráfaga corta permitida, luego 429) — capa
    # extra sobre el rate limiter de cuenta ya existente en el backend, que
    # no cubre credential stuffing distribuido entre muchos usuarios/IPs.
    location ^~ /api/auth/login/ {
        limit_req zone=api_login burst=5 nodelay;
        limit_conn conn_per_ip 10;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Corrección ortográfica / redacción (LanguageTool + Ollama vía backend C++)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # Corrección 2026-07-29: por defecto nginx BUFEREA toda la respuesta del
        # upstream antes de reenviarla al cliente -- para los dos endpoints SSE
        # de este backend (/api/live/kpi, /api/support/chat/stream) eso anulaba
        # el streaming por completo: el navegador recibía los ~130 eventos de
        # golpe al final en vez de uno a uno según se generaban (confirmado en
        # vivo: 133 eventos con timestamp idéntico). proxy_buffering off aplica
        # a todo /api/ -- inofensivo para las respuestas JSON normales (nginx
        # igual reenvía cada chunk que recibe, solo deja de acumular en RAM
        # antes de hacerlo), y es necesario para que cualquier SSE futuro bajo
        # /api/ funcione sin tener que acordarse de este detalle cada vez.
        proxy_buffering off;
        proxy_cache off;
    }

    location /ws {
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Tileserver local (MBTiles, DetailedMap.tsx): mismo origen que la SPA, no
    # un puerto 8000 externo — necesario para portabilidad (antes hardcodeado
    # a http://localhost:8000, roto en cualquier deploy real) y para no violar
    # connect-src 'self' del CSP de arriba.
    location ^~ /tiles/ {
        rewrite ^/tiles(/.*)$ $1 break;
        proxy_pass http://$upstream_tiles;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
