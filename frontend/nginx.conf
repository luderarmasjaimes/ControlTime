server {
    listen 80;
    server_name localhost;

    # Headers de seguridad para el contenido ESTÁTICO servido por nginx
    # (SPA/assets), aplicados solo en las locations de abajo — NO a nivel
    # `server`, para no duplicarlos sobre las respuestas proxificadas
    # (/api/, /formula-api/): el backend C++ ya los agrega una vez en
    # router.cpp::dispatch(), y `add_header` a nivel server se propagaría
    # también a esas locations sumándose a los del backend (headers
    # repetidos en la misma respuesta).
    # CSP completo queda pendiente (requiere auditar todos los orígenes de
    # script/style/img/connect ya en uso — Google Fonts, Tailwind CDN, etc. —
    # antes de poder aplicar una política estricta sin romper la app).

    # Evita que el navegador deje una SPA antigua (login viejo) al no reconstruir la imagen
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires -1;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # SPA: evita HTML antiguo (y referencias a chunks viejos) al abrir rutas como /report-studio sin /index.html
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        alias /data/;
        autoindex on;
    }

    # Motor FORMULA embebido: API + WS (mismo origen que la SPA; no usa puerto 8021 externo)
    location ^~ /formula-api/ws {
        proxy_pass http://formula_engine:8020/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /formula-api/ {
        proxy_pass http://formula_engine:8020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Corrección ortográfica / redacción (LanguageTool + Ollama vía backend C++)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /ws {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
