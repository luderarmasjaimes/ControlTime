# Rate limiting a nivel proxy (defensa en profundidad además del limitador
# de login por cuenta a nivel app en backend/src/main.cpp — ver
# GAP_ANALYSIS_2026-07-04.md). Estas zonas viven en el contexto http porque
# este archivo se incluye vía conf.d/*.conf dentro del http{} base de la
# imagen nginx (ver frontend/Dockerfile).
# api_general excluye la subred interna de Docker Compose de este proyecto
# (172.18.0.0/16 -- confirmado vía `docker network inspect`, sin subred fija
# declarada en docker-compose.yml, así que se referencia por el rango real
# actual) de su límite de 20 r/s. Por qué: ese límite se calibró para tráfico
# de UN usuario navegando la app -- el sidecar `pdf_export` (Fase 2 de
# captura DOCX en paralelo, `pdf-export-service/server.js`) abre varias
# pestañas de Chromium EN PARALELO que navegan hacia este mismo nginx, todas
# desde el mismo contenedor: nginx las ve como un único cliente en ráfaga muy
# por encima de 20 r/s, sin importar cuánto se ajuste la cuota interna de la
# app (ver `AsyncTelemetryQueue.setQuota` en api.ts) -- reproducido en vivo:
# con 4 workers, export atascado 5+ minutos sin ninguna captura, reintentando
# contra este límite. Es tráfico interno, service-to-service, autenticado
# igual que cualquier request de la app -- exactamente lo que este límite NO
# fue pensado para frenar (su objetivo es abuso desde la red pública). Una IP
# pública JAMÁS puede presentarse como perteneciente a esta subred (Docker
# hace NAT/publica puertos, nunca expone la red bridge interna tal cual), así
# que la excepción no abre ninguna vía de bypass desde afuera. Los límites
# MÁS estrictos (api_login, org_access, csp_report, abajo) NO se tocan: el
# sidecar nunca les pega, y esas rutas siguen protegidas igual que siempre.
geo $rate_limit_is_internal {
    default 0;
    172.18.0.0/16 1;
}
map $rate_limit_is_internal $api_general_limit_key {
    1 "";
    default $binary_remote_addr;
}
limit_req_zone $api_general_limit_key zone=api_general:10m rate=20r/s;
# 15r/m (antes 5r/m, 2026-08-19): 5/min resultó demasiado ajustado para el
# uso real -- calibrar distancia/iluminación de la biometría facial implica
# varios reintentos legítimos de login en poco tiempo, y esta zona los
# contaba igual que intentos de fuerza bruta. Sigue siendo una defensa real
# (bloquea ráfagas automatizadas) en profundidad sobre el limitador de
# cuenta del backend (la defensa principal contra fuerza bruta real).
limit_req_zone $binary_remote_addr zone=api_login:10m rate=15r/m;
# db_scripts/72: zona dedicada para /api/auth/org-access/ (grant/revoke de
# acceso cruzado de personal de organización a empresas mineras clientes) --
# es la capacidad de mayor privilegio nueva de esta plataforma, mismo criterio
# de "límite más estricto que el general" que ya se aplica a api_login.
limit_req_zone $binary_remote_addr zone=org_access:10m rate=10r/m;
# report-uri de la CSP (router.cpp / location /index.html de abajo): público,
# sin sesión ni CSRF a propósito (lo llama el navegador solo, no JS de la
# página) -- por eso necesita su propio límite en vez de heredar api_general:
# nada impide que alguien lo golpee directo como flood/log-spam sin siquiera
# tener una sesión. 20r/m alcanza sobrado para violaciones reales (que además
# son raras en operación normal) sin abrir una vía de negación de servicio
# barata contra el propio log.
limit_req_zone $binary_remote_addr zone=csp_report:10m rate=20r/m;
# Misma excepción de red interna que `api_general_limit_key` arriba -- las N
# pestañas en paralelo del sidecar `pdf_export` también pueden acumular más
# de 20 conexiones simultáneas EN SÍ MISMAS (una por request en vuelo), sin
# que eso sea el escenario de abuso que este límite busca frenar.
map $rate_limit_is_internal $conn_per_ip_limit_key {
    1 "";
    default $binary_remote_addr;
}
limit_conn_zone $conn_per_ip_limit_key zone=conn_per_ip:10m;
# El comentario de abajo (location /api/auth/login/) ya decía "luego 429",
# pero nginx devuelve 503 por defecto ante un limit_req sin esta directiva
# -- confirmado en runtime 2026-08-19: pruebas repetidas de login (distintas
# distancias/luz) superaron las 5r/m y el usuario vio "Error HTTP 503" sin
# explicación, un código que normalmente significa "servidor caído", no
# "esperá un momento". 429 (Too Many Requests) es el código HTTP correcto
# para rate limiting, y permite al frontend (authApi.ts) distinguirlo de una
# caída real del backend para mostrar un mensaje claro.
limit_req_status 429;

# Compresión (2026-08-02): la imagen base de nginx trae `gzip on` pero SOLO
# para text/html — todo lo demás salía sin comprimir. El bundle de la SPA son
# ~9.3MB de JS (main + ReadOnlyViewer + html2canvas) que viajaban íntegros por
# la red en cada carga fría: sobre un enlace satelital/4G de unidad minera
# (~2 Mbps reales) eso son ~37s solo de descarga de JS. Con gzip nivel 6 el JS
# baja a ~1/4 (JS minificado comprime muy bien).
#
# `gzip_static on` sirve el `.gz` precomprimido si existe junto al asset, sin
# gastar CPU en runtime; hoy el build no los genera todavía, así que cae al
# gzip dinámico de abajo (queda listo para cuando se precomprima en el build).
#
# gzip_proxied any: sin esto nginx NO comprime respuestas que vienen de un
# upstream proxificado (las de /api/), que es justo donde están los JSON
# grandes de telemetría/KPIs.
#
# gzip_min_length 1024: comprimir payloads diminutos (la mayoría de respuestas
# JSON de estado) cuesta más CPU y bytes de cabecera de lo que ahorra.
gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/geo+json
    application/xml
    application/wasm
    image/svg+xml;

server {
    listen 80;
    server_name localhost;

    # Re-resolución DNS de upstreams (incidente 2026-07-11): nginx resuelve los
    # hostnames de proxy_pass UNA sola vez al arrancar; si un contenedor
    # upstream se recrea con otra IP (p.ej. `docker compose up -d web`), nginx
    # sigue apuntando a la IP vieja y TODO /api devuelve 502 hasta reiniciarlo,
    # aunque ambos contenedores figuren "healthy". Con el resolver embebido de
    # Docker (127.0.0.11) + proxy_pass vía variable, nginx re-resuelve cada
    # valid=10s y sobrevive a recreaciones de upstream sin reinicio.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_backend backend:8081;
    set $upstream_formula formula_engine:8020;
    set $upstream_tiles tileserver:8000;

    # Headers de seguridad para el contenido ESTÁTICO servido por nginx
    # (SPA/assets), aplicados solo en las locations de abajo — NO a nivel
    # `server`, para no duplicarlos sobre las respuestas proxificadas
    # (/api/, /formula-api/): el backend C++ ya los agrega una vez en
    # router.cpp::dispatch(), y `add_header` a nivel server se propagaría
    # también a esas locations sumándose a los del backend (headers
    # repetidos en la misma respuesta).
    # CSP (cerrado 2026-07-07 tras auditar todos los orígenes externos reales:
    # Google Fonts, Tailwind Play CDN, y los WMS de mapas). img-src permite
    # "https:" sin restringir host porque MapViewer.tsx tiene un campo real de
    # "WMS personalizado (URL manual)" que deja al usuario apuntar a cualquier
    # GeoServer propio — un allowlist fijo de hosts rompería esa función. Ver
    # el mismo razonamiento, más detallado, en applySecurityHeaders() de
    # backend/src/http/router.cpp.
    #
    # media-src (agregado 2026-08-17): sin directiva propia, un <video>/<audio>
    # cae al default-src 'self' -- que NO incluye data:/blob:. Los videos que
    # graba VideoInsertModal.tsx (cámara web o pantalla, ADR-064/065) se
    # insertan como data URL base64 (mismo patrón inline que las imágenes,
    # que sí funcionaban porque img-src las lista explícito) y la vista previa
    # en vivo usa un blob: de MediaRecorder -- sin este permiso, nginx servía
    # igual el bloque de video (duración correcta, tomada del timer de
    # grabación, no del propio <video>) pero el navegador bloqueaba la carga
    # del recurso por CSP: se veía en negro sin ningún error visible para el
    # usuario. Reproducido detrás de nginx (build de producción); el dev
    # server de Vite no manda CSP, por eso ahí sí se veía bien.

    # Evita que el navegador deje una SPA antigua (login viejo) al no reconstruir la imagen
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; report-uri /api/security/csp-report" always;
        # Reconocimiento facial de login/registro (AuthGateway.tsx) usa
        # getUserMedia() en el propio origen -- sin esta cabecera, algunos
        # navegadores heredan una Permissions-Policy más restrictiva del
        # documento padre/embedding y bloquean la cámara con un error opaco
        # antes de que el usuario vea siquiera el diálogo de permiso.
        add_header Permissions-Policy "camera=(self), microphone=()" always;
        expires -1;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; report-uri /api/security/csp-report" always;
    }

    # Binarios de MediaPipe Tasks Vision (WASM + modelo .task) self-hosted por
    # el CSP `connect-src 'self'` de abajo -- ver mediapipeFaceTracker.ts. Sin
    # este location caían en el catch-all `location /` (Cache-Control
    # no-store): cada carga de login/registro facial iba a re-descargar ~26MB
    # de WASM+modelo en vez de servirlos desde caché del navegador. Igual que
    # /assets/, son binarios versionados por el propio path del build (no
    # cambian entre requests), así que largo plazo + immutable es seguro.
    location ^~ /mediapipe/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; report-uri /api/security/csp-report" always;
    }

    # Service Worker de tiles (tile-cache-sw.js) con CSP PROPIA — incidente
    # real 2026-07-18: los fetch() que un Service Worker hace están regidos
    # por la CSP del SCRIPT DEL WORKER, no por la de la página. Este SW
    # intercepta los tiles de mapas (Google satelital, WMS INGEMMET/MINEM/
    # OEFA/SENAMHI/IDEP...) y los re-pide con fetch() interno; con la CSP
    # general de abajo (connect-src 'self', sin https: general) TODOS esos fetch
    # externos morían al instante ("Failed to fetch" en 0ms) → el 100% de
    # los tiles del mapa (base + WMS gubernamentales) aparecían rotos aunque
    # los servidores respondieran bien. Se abre connect-src https: SOLO para
    # este worker (mismo criterio que img-src https: de la página: el campo
    # "WMS personalizado (URL manual)" permite cualquier GeoServer, no hay
    # allowlist cerrada posible); la CSP estricta de la SPA no cambia.
    location = /tile-cache-sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; connect-src 'self' https:" always;
        expires -1;
    }

    # SPA: evita HTML antiguo (y referencias a chunks viejos) al abrir rutas como /report-studio sin /index.html
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; report-uri /api/security/csp-report" always;
        add_header Permissions-Policy "camera=(self), microphone=()" always;
        try_files $uri $uri/ /index.html;
    }

    # Sin autoindex: el frontend siempre referencia rutas exactas conocidas
    # (ej. AuthGateway.tsx login backgrounds, MapViewer tiles/GeoJSON) — listar
    # el árbol completo del volumen ./data no aporta funcionalidad y expone
    # nombres de archivo internos.
    location /data/ {
        alias /data/;
        autoindex off;
    }

    # Motor FORMULA embebido: API + WS (mismo origen que la SPA; no usa puerto 8021 externo)
    location ^~ /formula-api/ws {
        rewrite ^/formula-api(/ws.*)$ $1 break;
        proxy_pass http://$upstream_formula;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Token del motor FORMULA inyectado server-side (envsubst al arrancar,
        # ver frontend/Dockerfile): el editor embebido ya no depende de que el
        # usuario siembre AUTH_TOKEN en localStorage (herencia del despliegue
        # standalone) y el secreto nunca se expone al navegador.
        proxy_set_header Authorization "Bearer ${BEEMETRY_FORMULA_AUTH_TOKEN}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /formula-api/ {
        rewrite ^/formula-api(/.*)$ $1 break;
        proxy_pass http://$upstream_formula;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    # Login: límite más estricto (ráfaga corta permitida, luego 429) — capa
    # extra sobre el rate limiter de cuenta ya existente en el backend, que
    # no cubre credential stuffing distribuido entre muchos usuarios/IPs.
    location ^~ /api/auth/login/ {
        limit_req zone=api_login burst=10 nodelay;
        limit_conn conn_per_ip 10;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # db_scripts/72: grant/revoke de acceso cruzado -- límite propio más
    # estricto, misma técnica que /api/auth/login/ de arriba (^~ para ganar
    # sobre el prefijo general /api/). El backend re-valida el permiso y el
    # tipo de tenant en cada request; esto es defensa en profundidad de red.
    location ^~ /api/auth/org-access/ {
        limit_req zone=org_access burst=5 nodelay;
        limit_conn conn_per_ip 5;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/security/csp-report {
        limit_req zone=csp_report burst=10 nodelay;
        limit_conn conn_per_ip 5;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET /api/reports/{id}/export/pdf es SÍNCRONO de punta a punta (una sola
    # conexión HTTP viva: navegador -> nginx -> backend -> sidecar Puppeteer
    # -> vuelta), a diferencia de /export/pptx y /export/docx (asíncronos,
    # el navegador solo hace polling corto de un job_id). El timeout general
    # de /api/ (180s, ver su comentario) mata esta conexión con un 504 de
    # nginx mientras el backend/sidecar SIGUEN trabajando de fondo -- el
    # cliente ve un error aunque el export termine bien poco después
    # (reproducido en vivo: 504 a los 180s exactos en un informe de 144
    # páginas que en realidad tardaba ~5-6 min, igual que DOCX/PPTX).
    # Location más específica -> nginx la prioriza sobre /api/ genérica.
    location ~ ^/api/reports/[^/]+/export/pdf$ {
        limit_req zone=api_general burst=40 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        limit_conn conn_per_ip 20;
        # Default de nginx (1m) rechazaba con 413 el guardado de un informe
        # grande ANTES de llegar al backend -- reproducido en vivo:
        # POST /api/reports de un lienzo de 378 páginas / 1120 bloques
        # (varios MB de JSON) devolvía 413 Request Entity Too Large acá,
        # pese a que main.cpp YA sube su propio límite a 64MB para este
        # mismo caso (ver el comentario de `parser.body_limit(64 * 1024 *
        # 1024)` en main.cpp) -- mismo techo acá para que ambos coincidan.
        client_max_body_size 64m;
        # Default de nginx (8k/16k según arquitectura) hacía que CADA POST a
        # /api/process_frame (JPEG de la captura biométrica en vivo, ~175ms
        # de cadencia) se bufereara a un archivo temporal en disco --
        # confirmado en vivo: "a client request body is buffered to a
        # temporary file" en el log de error por cada frame, sin excepción,
        # desde que la resolución de captura subió a 1280x960 (ver
        # facialIcaoConfig.ts). Ese I/O a disco en el camino crítico de un
        # endpoint de tiempo real es justo el tipo de demora que se sentía
        # como "tarda mucho en avanzar de etapa" durante la validación
        # biométrica. 2m alcanza de sobra para un frame JPEG a esta
        # resolución y para el payload de registro (imagen + óvalo + busto).
        client_body_buffer_size 2m;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Corrección ortográfica / redacción (LanguageTool + Ollama vía backend C++)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # Corrección 2026-07-29: por defecto nginx BUFEREA toda la respuesta del
        # upstream antes de reenviarla al cliente -- para los dos endpoints SSE
        # de este backend (/api/live/kpi, /api/support/chat/stream) eso anulaba
        # el streaming por completo: el navegador recibía los ~130 eventos de
        # golpe al final en vez de uno a uno según se generaban (confirmado en
        # vivo: 133 eventos con timestamp idéntico). proxy_buffering off aplica
        # a todo /api/ -- inofensivo para las respuestas JSON normales (nginx
        # igual reenvía cada chunk que recibe, solo deja de acumular en RAM
        # antes de hacerlo), y es necesario para que cualquier SSE futuro bajo
        # /api/ funcione sin tener que acordarse de este detalle cada vez.
        proxy_buffering off;
        proxy_cache off;
    }

    location /ws {
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Tileserver local (MBTiles, DetailedMap.tsx): mismo origen que la SPA, no
    # un puerto 8000 externo — necesario para portabilidad (antes hardcodeado
    # a http://localhost:8000, roto en cualquier deploy real) y para no violar
    # connect-src 'self' del CSP de arriba.
    location ^~ /tiles/ {
        rewrite ^/tiles(/.*)$ $1 break;
        proxy_pass http://$upstream_tiles;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# TLS público OPCIONAL (VPS expuesto a estaciones de clientes mineros
# externos, no solo LAN): `include` con comodín no falla si el directorio no
# existe o está vacío (a diferencia de una ruta literal) -- deja el arranque
# de dev/local intacto sin certificados. Para habilitarlo en producción: crear
# el volumen `./nginx-tls-enabled:/etc/nginx/tls-enabled:ro` en
# docker-compose.prod.yml, generar un certificado real (Let's Encrypt/certbot)
# y colocar ahí una copia de frontend/nginx-tls-server.conf.example con las
# rutas de certificado reales. Ver docs/integration/ACCESS_CONTROL_API_GUIDE.md.
include /etc/nginx/tls-enabled/*.conf;
