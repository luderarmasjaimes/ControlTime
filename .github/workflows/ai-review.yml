name: AI Review (ADR + SPEC)

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      AURIXA_LLM_MODE: mock
      AURIXA_LLM_REVIEW: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ai_platform
        run: pip install -r ai_platform/requirements.txt

      - name: Build RAG index
        run: python -m ai_platform rag index

      - name: Generate diff
        run: |
          git fetch origin ${{ github.base_ref }} 2>/dev/null || true
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff 2>/dev/null || git diff HEAD~1 > pr.diff
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed.txt 2>/dev/null || git diff --name-only HEAD~1 > changed.txt

      - name: Run reviewer
        run: |
          FILES=$(tr '\n' ' ' < changed.txt)
          python -m ai_platform review \
            --body "${{ github.event.pull_request.body }}" \
            --diff-file pr.diff \
            --files $FILES > review_report.md || true
          cat review_report.md

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Revisión IA Beemetry (ADR + SPEC)\n\n';
            try { body += fs.readFileSync('review_report.md', 'utf8'); }
            catch (e) { body += '_Informe no generado._'; }
            body += '\n\n---\n_Automático — registro canónico ADR-090_';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
